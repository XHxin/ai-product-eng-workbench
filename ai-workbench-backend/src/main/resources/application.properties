spring.application.name=ai-workbench-backend
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
workbench.integrations.encryption-key=${WORKBENCH_ENCRYPTION_KEY:}
workbench.integrations.connect-timeout=${WORKBENCH_INTEGRATION_CONNECT_TIMEOUT:3s}
workbench.integrations.read-timeout=${WORKBENCH_INTEGRATION_READ_TIMEOUT:15s}
spring.datasource.url=${DB_URL:jdbc:h2:mem:workbench;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
